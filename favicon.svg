<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0d111a"/>
  <g transform="rotate(-4 40 40)">
    <rect x="18" y="18" width="46" height="46" rx="11" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  </g>
  <g transform="rotate(6 60 60)">
    <rect x="36" y="36" width="46" height="46" rx="11" fill="url(#cyanGrad)" stroke="#0d111a" stroke-width="3.5" filter="url(#shadow)"/>
  </g>
  <text x="50" y="58" font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">SK</text>
</svg>
